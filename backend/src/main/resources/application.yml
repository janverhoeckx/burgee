spring:
  application:
    name: burgee
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/burgee}
    username: ${DB_USERNAME:burgee}
    password: ${DB_PASSWORD:burgee}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

burgee:
  admin:
    username: ${BURGEE_ADMIN_USERNAME:admin}
    password: ${BURGEE_ADMIN_PASSWORD:admin}

logging:
  level:
    root: INFO
    io.burgee: INFO
