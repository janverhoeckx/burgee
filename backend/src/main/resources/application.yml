spring:
  application:
    name: burgee
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/burgee}
    username: ${DB_USERNAME:burgee}
    password: ${DB_PASSWORD:burgee}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

burgee:
  auth:
    method: ${BURGEE_AUTH_METHOD:basic}
  admin:
    username: ${BURGEE_ADMIN_USERNAME:admin}
    password: ${BURGEE_ADMIN_PASSWORD:admin}
    # Identity-provider subject (the sub/uid the IDP issues) to bootstrap as admin on startup.
    # Use with jwt so a first admin can be created without touching the database.
    subject: ${BURGEE_ADMIN_SUBJECT:}
  jwt:
    issuer-uri: ${BURGEE_JWT_ISSUER_URI:-}
    client-id: ${BURGEE_JWT_CLIENT_ID:-}
    scope: ${BURGEE_JWT_SCOPE:openid profile email}
    resource-uri: ${BURGEE_JWT_RESOURCE_URI:}

# JWT / OIDC resource-server configuration (when burgee.auth.method=jwt)
# The SPA performs the authorization-code (PKCE) login client-side and
 # sends the resulting bearer token; the backend  validates it against
# the issuer's published keys. Override per environment with:
#   BURGEE_JWT_ISSUER_URI    the OIDC issuer
#   BURGEE_JWT_CLIENT_ID     the public SPA client id registered with the provider
#   BURGEE_JWT_SCOPE         requested scopes (default: openid profile email)
#   BURGEE_JWT_RESOURCE_URI  resource indicator (RFC 8707)

logging:
  level:
    root: INFO
    io.github.janverhoeckx.burgee: INFO
