spring:
  application:
    name: burgee
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/burgee}
    username: ${DB_USERNAME:burgee}
    password: ${DB_PASSWORD:burgee}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

burgee:
  auth:
    method: ${BURGEE_AUTH_METHOD:basic}
  admin:
    username: ${BURGEE_ADMIN_USERNAME:admin}
    password: ${BURGEE_ADMIN_PASSWORD:admin}
    # Identity-provider subject (the sub/uid the IDP issues) to bootstrap as admin on startup.
    # Use with oauth2/firebase so a first admin can be created without touching the database.
    subject: ${BURGEE_ADMIN_SUBJECT:}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    api-key: ${FIREBASE_API_KEY:}
    auth-domain: ${FIREBASE_AUTH_DOMAIN:}

# OAuth2 OIDC configuration (when burgee.auth.method=oauth2)
# Uncomment and configure for your provider:
#
# spring:
#   security:
#     oauth2:
#       client:
#         registration:
#           google:
#             client-id: ${GOOGLE_CLIENT_ID}
#             client-secret: ${GOOGLE_CLIENT_SECRET}
#             scope: openid,email,profile
#
# Built-in providers: google, github, facebook, okta
# For a custom OIDC provider, also add a provider block:
#         provider:
#           my-provider:
#             issuer-uri: https://my-idp.example.com
#
# Firebase configuration (when burgee.auth.method=firebase)
# Set FIREBASE_PROJECT_ID, FIREBASE_API_KEY, and FIREBASE_AUTH_DOMAIN
# The backend validates JWTs via https://securetoken.google.com/<project-id>
# The frontend uses the Firebase JS SDK for authentication

logging:
  level:
    root: INFO
    io.github.janverhoeckx.burgee: INFO
