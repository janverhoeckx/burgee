<div class="card">
  <h1>Sign in</h1>
  @if (auth.method() === 'jwt') {
    <p class="muted">Sign in with your identity provider.</p>
    @if (error()) {
      <div class="error">{{ error() }}</div>
    }
    <button class="provider-btn" (click)="signIn()" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  } @else {
    <p class="muted">Use your Burgee admin credentials.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" formControlName="username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
      </div>
      @if (error()) {
        <div class="error">{{ error() }}</div>
      }
      <button class="primary" type="submit" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  }
</div>
