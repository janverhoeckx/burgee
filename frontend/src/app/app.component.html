<header class="topbar">
  <a routerLink="/flags" class="brand">
    <img src="assets/burgee-logo.png" alt="Burgee" class="logo" />
  </a>
  @if (auth.isAuthenticated()) {
    <div class="actions">
      <span class="user">{{ auth.username() }}</span>
      <button (click)="logout()">Sign out</button>
    </div>
  }
</header>
<main class="content">
  <router-outlet />
</main>
