services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: burgee
      POSTGRES_USER: burgee
      POSTGRES_PASSWORD: ${DB_PASSWORD:-burgee}
    volumes:
      - burgee-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burgee -d burgee"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  burgee:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/burgee
      DB_USERNAME: burgee
      DB_PASSWORD: ${DB_PASSWORD:-burgee}
      BURGEE_AUTH_METHOD: ${BURGEE_AUTH_METHOD:-basic}
      BURGEE_ADMIN_USERNAME: ${BURGEE_ADMIN_USERNAME:-admin}
      BURGEE_ADMIN_PASSWORD: ${BURGEE_ADMIN_PASSWORD:-admin}
      # OAuth2 OIDC (when BURGEE_AUTH_METHOD=oauth2):
      # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Firebase (when BURGEE_AUTH_METHOD=firebase):
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      SERVER_PORT: 8080
    ports:
      - "${BURGEE_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  burgee-pgdata:
