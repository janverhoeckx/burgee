services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: burgee
      POSTGRES_USER: burgee
      POSTGRES_PASSWORD: ${DB_PASSWORD:-burgee}
    volumes:
      - burgee-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burgee -d burgee"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  burgee:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/burgee
      DB_USERNAME: burgee
      DB_PASSWORD: ${DB_PASSWORD:-burgee}
      BURGEE_AUTH_METHOD: ${BURGEE_AUTH_METHOD:-basic}
      BURGEE_ADMIN_USERNAME: ${BURGEE_ADMIN_USERNAME:-admin}
      BURGEE_ADMIN_PASSWORD: ${BURGEE_ADMIN_PASSWORD:-admin}
      BURGEE_ADMIN_SUBJECT: ${BURGEE_ADMIN_SUBJECT:-}
      # JWT / OIDC resource server (when BURGEE_AUTH_METHOD=jwt)
      BURGEE_JWT_ISSUER_URI: ${BURGEE_JWT_ISSUER_URI:-}
      BURGEE_JWT_CLIENT_ID: ${BURGEE_JWT_CLIENT_ID:-}
      BURGEE_JWT_SCOPE: ${BURGEE_JWT_SCOPE:-openid profile email}
      BURGEE_JWT_RESOURCE_URI: ${BURGEE_JWT_RESOURCE_URI:-}
      SERVER_PORT: 8080
    ports:
      - "${BURGEE_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  burgee-pgdata:
